# 自動檢查：每次 push / PR 都會跑，只跑不需要網路與 Discord 的測試
# Automatic checks: run on every push / PR, only the tests that need no network and no Discord
# (完整測試請在自己的電腦跑 tests/run_all.py / run the full suite on your own machine with tests/run_all.py)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
      - name: Compile everything (syntax check)
        run: python -m compileall -q bot.py musicbot launcher tests
      - name: Offline tests (stutter detector, relay hardening, recovery, sources, queue window, notices)
        run: python tests/run_all.py health_unit harden_test recover_unit source_unit window_unit notice_unit audio_unit library_unit spotify_unit persist_unit
      - name: Dependency audit (known vulnerabilities)
        run: pip-audit -r requirements.txt
        continue-on-error: true
